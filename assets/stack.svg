      from { transform: translateX(0); }
      to   { transform: translateX(-819.0px); }
    }
    @media (prefers-color-scheme: dark) {
      text { fill: #E6EDF3; }
      .k { stroke: #3D444D; }
    }
    @media (prefers-reduced-motion: reduce) {
      .strip { animation: none; }
    }
