      font-size: 15.00px;
      fill: #1F2328;
    }
    .k { fill: none; stroke: #D0D7DE; stroke-width: 1; }
    /* The strip sits at its start position when nothing animates, so the
       first items are readable even then. */
    .strip { animation: run 17.8s linear infinite; }
