<!doctype html>
<meta charset="utf-8">
<title>banner compact</title>
<style>
  :root{--paper:#F5F2EA;--ink:#12110F;--ink-70:#3E3A34;--ink-45:#6E6860;--rule:#12110F;--accent:#B3352A}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1000px;height:600px}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Mono",monospace;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
  .grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply}
  .frame{position:absolute;inset:16px;border:1px solid var(--rule)}
  .frame:after{content:"";position:absolute;inset:4px;border:1px solid var(--rule);opacity:.3}
  .sheet{position:absolute;inset:0;padding:44px 46px;display:flex;gap:38px}
  .plate{flex:0 0 250px;display:flex;flex-direction:column}
  .plate .img{border:1px solid var(--rule);padding:7px;height:442px;overflow:hidden}
  .plate img{width:234px;height:426px;display:block}
  .cap{margin-top:9px;padding-top:7px;border-top:1px solid rgba(18,17,15,.25);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-45);display:flex;justify-content:space-between}
  .col{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
  .eyebrow{font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-70);font-weight:600}
  .hr{height:1px;background:var(--rule);margin-top:14px}
  h1{font-size:92px;line-height:.95;font-weight:700;letter-spacing:-.04em;margin:20px 0 0}
  h1 .thin{font-weight:300}
  .lede{margin-top:22px;font-size:25px;line-height:1.42;color:var(--ink-70)}
  .prompt{margin-top:26px;font-size:23px;color:var(--ink)}
  .prompt .dim{color:var(--ink-45)}
  .cursor{display:inline-block;width:12px;height:22px;background:var(--accent);transform:translateY(3px)}
  .stats{margin-top:auto;padding-top:18px;border-top:1px solid var(--rule);display:flex}
  .stat{padding-right:26px;margin-right:26px;border-right:1px solid rgba(18,17,15,.22)}
  .stat:last-child{border:0;margin:0;padding:0}
  .stat .n{font-size:38px;font-weight:600;line-height:1;letter-spacing:-.02em}
  .stat .l{margin-top:8px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-45)}
</style>
<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer></filter>
  <rect width="100%" height="100%" filter="url(#g)"/>
</svg>
<div class="frame"></div>
<div class="sheet">
  <div class="plate">
    <div class="img"><img src="../assets/portrait-compact.png" alt=""></div>
    <div class="cap"><span>Fig. 1</span><span>A. Mwangi</span></div>
  </div>
  <div class="col">
    <div class="eyebrow">Backend &amp; Platform</div>
    <div class="hr"></div>
    <h1>AMOS<br><span class="thin">MWANGI</span></h1>
    <div class="lede">Python and Go services<br>that carry millions of rows.</div>
    <div class="prompt"><span class="dim">$</span> nairobi, ke <span class="dim">/</span> utc+3 <span class="cursor"></span></div>
    <div class="stats">
      <div class="stat"><div class="n">12.6M</div><div class="l">records</div></div>
      <div class="stat"><div class="n">3,820</div><div class="l">contributions</div></div>
      <div class="stat"><div class="n">60%</div><div class="l">latency cut</div></div>
    </div>
  </div>
</div>
